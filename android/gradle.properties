org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# The project lives on F: while the pub cache lives on C:. Kotlin's relocatable
# incremental-compile cache stores plugin sources relative to the project root,
# and relativizing across two Windows drive roots throws, failing the build in
# :image_picker_android:compileDebugKotlin. Turning off incremental compilation
# avoids that code path entirely. Costs a little rebuild time; nothing else.
kotlin.incremental=false
